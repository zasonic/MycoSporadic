# MycoLoop broker config — MQTT 5, QoS 1, persistence for retained status.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
max_inflight_messages 20
max_queued_messages 1000
# Devices authenticate as username=device_id, password=device token.
# Provision with: mosquitto_passwd -b /mosquitto/config/passwd chamber-01 <token>
